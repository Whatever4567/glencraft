<!doctype html>
<meta charset="utf-8">
<title>pig studio</title>
<style>
  html,body{margin:0;background:#1a1a1c;overflow:hidden}
  canvas{display:block}
</style>
<body>
<script type="importmap">
{
  "imports": {
    "three": "/three/three.module.js",
    "three/addons/": "/three-addons/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {MeshoptDecoder} from 'three/addons/libs/meshopt_decoder.module.js';

const params = new URLSearchParams(location.search);
const MODEL = params.get('model') || '/assets/models/pig2.glb';
const TEX = params.get('tex') || '';
const W = +(params.get('w') || 1280);
const H = +(params.get('h') || 720);
const SCALE = +(params.get('scale') || 1.4);
const FACE = params.get('face') || 'z';

const renderer = new THREE.WebGLRenderer({antialias: true, alpha: false, preserveDrawingBuffer: true});
renderer.setSize(W, H, false);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 80);

function studioBackdrop() {
  scene.background = new THREE.Color(0xd8d6d2);
  scene.fog = new THREE.Fog(0xd8d6d2, 8, 18);
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(8, 64),
    new THREE.MeshStandardMaterial({color: 0xcfcbc6, roughness: 0.95, metalness: 0})
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
}
function worldBackdrop() {
  scene.background = new THREE.Color(0x87b7e0);
  scene.fog = new THREE.Fog(0x9ec6e6, 12, 28);
  const hemi = new THREE.Mesh(
    new THREE.SphereGeometry(20, 24, 16),
    new THREE.MeshBasicMaterial({color: 0x87b7e0, side: THREE.BackSide})
  );
  scene.add(hemi);
  const ground = new THREE.Mesh(
    new THREE.CircleGeometry(10, 64),
    new THREE.MeshStandardMaterial({color: 0x4a7a32, roughness: 0.9, metalness: 0})
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
}

const key = new THREE.DirectionalLight(0xfff3e4, 2.1);
key.position.set(-2.6, 4.2, 3.4);
key.castShadow = true;
key.shadow.mapSize.set(1024, 1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 16;
key.shadow.camera.left = key.shadow.camera.bottom = -3;
key.shadow.camera.right = key.shadow.camera.top = 3;
scene.add(key);
scene.add(new THREE.AmbientLight(0xffe8dc, 0.62));
const fill = new THREE.DirectionalLight(0xffe8dc, 0.85);
fill.position.set(3.2, 1.8, -1.2);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffe8d2, 0.45);
rim.position.set(0.2, 3.0, -3.4);
scene.add(rim);

await MeshoptDecoder.ready;
const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);

function loadGLB(url) {
  return new Promise((res, rej) => loader.load(url, res, undefined, rej));
}
const gltf = await loadGLB(MODEL);
const root = gltf.scene;
root.scale.setScalar(SCALE);
root.updateMatrixWorld(true);
root.traverse(o => {
  if (o.isMesh) {
    o.castShadow = true;
    o.receiveShadow = true;
    if (o.material) {
      const mats = [].concat(o.material);
      for (const m of mats) {
        if (!m) continue;
        m.side = THREE.FrontSide;
        if (m.map) m.map.colorSpace = THREE.SRGBColorSpace;
        if (m.metalness > 0.2 && (m.name || '').toLowerCase().includes('default')) m.metalness = 0.05;
      }
    }
    if (o.isSkinnedMesh && o.skeleton) o.skeleton.update();
  }
});
scene.add(root);
root.updateMatrixWorld(true);
root.traverse(o => { if (o.isSkinnedMesh && o.skeleton) o.skeleton.update(); });

if (TEX) {
  const tex = await new THREE.TextureLoader().loadAsync(TEX);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.flipY = false;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = [].concat(o.material);
    for (const m of mats) {
      if (!m) continue;
      m.map = tex;
      m.map.colorSpace = THREE.SRGBColorSpace;
      m.map.flipY = false;
      m.map.wrapS = m.map.wrapT = THREE.ClampToEdgeWrapping;
      m.color.setHex(0xffffff);
      if (m.normalMap) {
        m.normalMap.colorSpace = THREE.NoColorSpace;
        m.normalMap.flipY = false;
        m.normalMap.wrapS = m.normalMap.wrapT = THREE.ClampToEdgeWrapping;
      }
      if (m.aoMap) {
        m.aoMap.colorSpace = THREE.NoColorSpace;
        m.aoMap.flipY = false;
        m.aoMap.channel = 0;
      }
      m.needsUpdate = true;
    }
  });
}

root.traverse(o => {
  if (!o.isMesh || !o.material) return;
  for (const m of [].concat(o.material)) {
    if (!m) continue;
    if (m.aoMap) m.aoMap.channel = 0;
    if (m.normalMap) m.normalMap.colorSpace = THREE.NoColorSpace;
  }
});

const mixer = gltf.animations && gltf.animations.length ? new THREE.AnimationMixer(root) : null;
const clips = {};
if (mixer) {
  for (const c of gltf.animations) clips[c.name.toLowerCase()] = mixer.clipAction(c);
}

function worldBox(obj) {
  const box = new THREE.Box3();
  const v = new THREE.Vector3(), t = new THREE.Vector3(), acc = new THREE.Vector3(), w4 = new THREE.Vector3(), M = new THREE.Matrix4();
  obj.updateMatrixWorld(true);
  obj.traverse(o => {
    if (!o.isMesh || !o.geometry) return;
    if (o.isSkinnedMesh && o.skeleton) o.skeleton.update();
    const pos = o.geometry.attributes.position;
    const si = o.geometry.attributes.skinIndex, sw = o.geometry.attributes.skinWeight;
    const skinned = !!(o.isSkinnedMesh && o.skeleton && si && sw);
    for (let i = 0; i < pos.count; i++) {
      v.fromBufferAttribute(pos, i);
      if (skinned) {
        t.copy(v).applyMatrix4(o.bindMatrix);
        acc.set(0, 0, 0);
        for (let k = 0; k < 4; k++) {
          const w = sw.getComponent(i, k); if (!w) continue;
          const bi = si.getComponent(i, k);
          M.fromArray(o.skeleton.boneMatrices, bi * 16);
          acc.addScaledVector(w4.copy(t).applyMatrix4(M), w);
        }
        v.copy(acc).applyMatrix4(o.bindMatrixInverse);
      }
      v.applyMatrix4(o.matrixWorld);
      box.expandByPoint(v);
    }
  });
  return box;
}
function fitHeight(target) {
  const box = worldBox(root);
  const s = box.getSize(new THREE.Vector3());
  const h = s.y || 1;
  const k = target / h;
  root.scale.multiplyScalar(k);
  root.updateMatrixWorld(true);
  root.traverse(o => { if (o.isSkinnedMesh && o.skeleton) o.skeleton.update(); });
  // sit on y=0
  const b2 = worldBox(root);
  root.position.y -= b2.min.y;
  root.updateMatrixWorld(true);
  root.traverse(o => { if (o.isSkinnedMesh && o.skeleton) o.skeleton.update(); });
}

function frame(kind) {
  // pig2 (and the game's 1.4 scale) sits around the origin, about 1 unit tall.
  // Fixed cameras, same framing as the 1.2.48 software studio, so a broken CPU
  // bbox cannot shove the lens into the mesh.
  const S = SCALE;
  // face=x: pig2 faces -X. face=z (default): new models face +Z.
  const CAMS = FACE === 'x' ? {
    close:  {pos:[-1.1*S, 0.5*S, 0.7*S], look:[0, 0.42*S, 0]},
    threeq: {pos:[-1.4*S, 0.75*S, 1.15*S], look:[0, 0.38*S, 0]},
    side:   {pos:[0.1*S, 0.55*S, 1.85*S], look:[0, 0.35*S, 0]},
    front:  {pos:[-1.95*S, 0.48*S, 0.15*S], look:[0, 0.4*S, 0]},
    back:   {pos:[1.95*S, 0.6*S, 0.2*S], look:[0, 0.4*S, 0]},
    world:  {pos:[-2.0*S, 1.15*S, 1.8*S], look:[0, 0.3*S, 0]},
  } : {
    close:  {pos:[0.7*S, 0.55*S, 1.05*S], look:[0, 0.50*S, 0.20*S]},
    threeq: {pos:[1.5*S, 0.85*S, 1.55*S], look:[0, 0.42*S, 0.10*S]},
    side:   {pos:[2.1*S, 0.55*S, 0.15*S], look:[0, 0.42*S, 0.05*S]},
    front:  {pos:[0.06*S, 0.46*S, 2.05*S], look:[0, 0.48*S, 0.20*S]},
    portrait:{pos:[0.10*S, 0.46*S, 1.55*S], look:[0, 0.50*S, 0.22*S]},
    back:   {pos:[0.2*S, 0.7*S, -1.9*S],  look:[0, 0.4*S, 0]},
    world:  {pos:[2.4*S, 1.3*S, 2.5*S],   look:[0, 0.3*S, 0]},
  };
  const cam = CAMS[kind] || CAMS.threeq;
  camera.position.set(cam.pos[0], cam.pos[1], cam.pos[2]);
  camera.lookAt(cam.look[0], cam.look[1], cam.look[2]);
  camera.updateProjectionMatrix();
}

function pose(name, t) {
  if (mixer) mixer.stopAllAction();
  root.traverse(o => { if (o.isSkinnedMesh && o.skeleton) o.skeleton.pose(); });
  const act = clips[name];
  if (act) {
    act.reset().play();
    act.paused = true;
    act.time = t || 0;
    mixer.update(0);
  }
  root.updateMatrixWorld(true);
  root.traverse(o => { if (o.isSkinnedMesh && o.skeleton) o.skeleton.update(); });
}

window.__qa = {
  ready: true,
  model: MODEL,
  clips: Object.keys(clips),
  backdrop(kind) {
    // reset simple: just set colors / rebuild ground by kind
    if (kind === 'world') worldBackdrop();
    else studioBackdrop();
  },
  pose(clip, t, cam, back) {
    if (back === 'world') worldBackdrop();
    else studioBackdrop();
    pose(clip || '', t || 0);
    frame(cam || 'threeq');
    renderer.render(scene, camera);
  },
  capture() { return renderer.domElement.toDataURL('image/png'); },
  info() {
    const box = worldBox(root);
    const s = box.getSize(new THREE.Vector3());
    let tris = 0;
    root.traverse(o => {
      if (o.isMesh && o.geometry) {
        const g = o.geometry;
        tris += g.index ? g.index.count / 3 : (g.attributes.position.count / 3);
      }
    });
    let sk=0, bones=0; root.traverse(o=>{ if(o.isSkinnedMesh){ sk++; bones=o.skeleton?o.skeleton.bones.length:0; } });
    return {clips: Object.keys(clips), size: [s.x, s.y, s.z], tris, min: box.min.toArray(), max: box.max.toArray(), skinned:sk, bones};
  }
};
studioBackdrop();
pose('', 0);
frame('threeq');
renderer.render(scene, camera);
console.log('pig-studio ready', JSON.stringify(window.__qa.info()));
</script>
</body>
